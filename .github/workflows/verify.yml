name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  payment-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payment_test
          POSTGRES_PASSWORD: payment_test_only
          POSTGRES_DB: payment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payment_test -d payment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://payment_test:payment_test_only@127.0.0.1:5432/payment_test
      PAYMENT_TEST_DATABASE_URL: postgresql://payment_test:payment_test_only@127.0.0.1:5432/payment_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node backend/scripts/prisma-isolated.cjs generate
      - name: Apply migrations to disposable CI database
        working-directory: backend
        run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build:backend
      - run: npm run build:webapp
      - run: npm run build:admin
      - run: npm run build:landing
